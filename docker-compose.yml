services:
  shoplist:
    build:
      context: .
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    image: shoplist:latest
    container_name: shoplist
    environment:
      - PORT=3000
      - BUILD_SHA=${BUILD_SHA:-unknown}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
    volumes:
      - shoplist-data:/app/data
    restart: unless-stopped

volumes:
  shoplist-data:
